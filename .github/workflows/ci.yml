name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore Plastoids.sln

      - name: Build (warnings are errors)
        run: dotnet build Plastoids.sln -c Release --no-restore

      - name: Dependency audit (fails on any known vulnerability)
        run: |
          dotnet list Plastoids.sln package --vulnerable --include-transitive | tee audit.txt
          ! grep -q "has the following vulnerable packages" audit.txt

      - name: Secrets scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Unit and architecture tests
        run: |
          dotnet test tests/Plastoids.SharedKernel.Tests -c Release --no-build --logger "trx;LogFileName=kernel.trx" --collect:"XPlat Code Coverage"
          dotnet test tests/Plastoids.ArchitectureTests -c Release --no-build --logger "trx;LogFileName=arch.trx"
          dotnet test tests/Plastoids.Modules.Identity.Tests -c Release --no-build --logger "trx;LogFileName=identity.trx" --collect:"XPlat Code Coverage"
          dotnet test tests/Plastoids.Modules.Marketplace.Tests -c Release --no-build --logger "trx;LogFileName=marketplace.trx" --collect:"XPlat Code Coverage"
          dotnet test tests/Plastoids.Modules.Money.Tests -c Release --no-build --logger "trx;LogFileName=money.trx" --collect:"XPlat Code Coverage"
          dotnet test tests/Plastoids.Modules.Sessions.Tests -c Release --no-build --logger "trx;LogFileName=sessions.trx" --collect:"XPlat Code Coverage"
          dotnet test tests/Plastoids.Modules.Learning.Tests -c Release --no-build --logger "trx;LogFileName=learning.trx" --collect:"XPlat Code Coverage"
          dotnet test tests/Plastoids.Modules.Sponsorship.Tests -c Release --no-build --logger "trx;LogFileName=sponsorship.trx" --collect:"XPlat Code Coverage"
          dotnet test tests/Plastoids.Modules.Payouts.Tests -c Release --no-build --logger "trx;LogFileName=payouts.trx" --collect:"XPlat Code Coverage"
          dotnet test tests/Plastoids.Modules.Notifications.Tests -c Release --no-build --logger "trx;LogFileName=notifications.trx" --collect:"XPlat Code Coverage"
          dotnet test tests/Plastoids.Modules.BackOffice.Tests -c Release --no-build --logger "trx;LogFileName=backoffice.trx" --collect:"XPlat Code Coverage"

      - name: Integration tests (Testcontainers)
        run: dotnet test tests/Plastoids.IntegrationTests -c Release --no-build --logger "trx;LogFileName=integration.trx"

      - name: Export OpenAPI
        run: |
          docker compose up -d --wait mysql kafka redis
          ASPNETCORE_ENVIRONMENT=Development ASPNETCORE_URLS=http://localhost:5080 dotnet run --project src/Plastoids.Api -c Release --no-build &
          for i in $(seq 1 60); do curl -sf http://localhost:5080/health/live && break; sleep 2; done
          mkdir -p artifacts && curl -sf http://localhost:5080/openapi/v1.json -o artifacts/openapi.json
          docker compose down

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-and-openapi
          path: |
            **/TestResults/**/*.trx
            **/TestResults/**/coverage.cobertura.xml
            artifacts/openapi.json

  docker-image:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t plastoids-api:${{ github.sha }} -f src/Plastoids.Api/Dockerfile .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Dependency audit (high and above)
        run: npm audit --omit=dev --audit-level=high
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
